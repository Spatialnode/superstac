[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/config",
    "crates/search",
    "crates/engine",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/spatialnode/superstac"
homepage = "https://github.com/spatialnode/superstac"
authors = ["Emmanuel Jolaiya <emmanuel@spatialnode.com>"]
