[package]
name = "superstac-python"
description = "Python bindings for SuperSTAC via PyO3."
keywords = ["stac", "geospatial", "federated", "satellite", "python"]
categories = ["science::geo"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
publish = false

[lib]
name = "_superstac"
crate-type = ["cdylib"]

[dependencies]
superstac-core = { path = "../core", version = "0.3.0" }
superstac-config = { path = "../config", version = "0.3.0" }
superstac-engine = { path = "../engine", version = "0.3.0" }
superstac-search = { path = "../search", version = "0.3.0" }
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py39"] }
pyo3-async-runtimes = { version = "0.26", features = ["tokio-runtime"] }
pythonize = "0.26"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread"] }

[features]
default = []
geoparquet = ["superstac-engine/geoparquet"]
