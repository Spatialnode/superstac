[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "superstac"
description = "Many catalogs. One search. Search across STAC catalogs with Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Emmanuel Jolaiya", email = "emmanuel@spatialnode.com" }]
requires-python = ">=3.9"
keywords = ["stac", "geospatial", "federated", "satellite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: GIS",
]
dynamic = ["version"]
dependencies = []


[project.urls]
Homepage = "https://spatialnode.com/superstac"
Documentation = "https://spatialnode.com/superstac"
Repository = "https://github.com/spatialnode/superstac"
Changelog = "https://github.com/spatialnode/superstac/blob/main/CHANGELOG.md"

[tool.maturin]
# Build into the `superstac` Python package; the compiled module is
# importable as `superstac._superstac` and re-exported by __init__.py.
python-source = "python"
module-name = "superstac._superstac"
features = ["pyo3/extension-module"]

