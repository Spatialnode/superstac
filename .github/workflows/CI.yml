name: Package checks

on:
  pull_request:
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', 'scripts/**', '.github/workflows/CI.yml', '.github/workflows/publish.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-release-version.py
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88.0'
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude superstac-python --locked
      - run: cargo test -p superstac-cli -p superstac-engine --features geoparquet --locked
      - run: cargo check -p superstac-python --no-default-features --locked

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88.0'
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/wasm/package-lock.json
      - run: cargo install wasm-pack --version 0.13.1 --locked
      - run: wasm-pack build crates/wasm --target web --release --locked
      - run: npm ci
        working-directory: crates/wasm
      - run: npx playwright install --with-deps chromium
        working-directory: crates/wasm
      - run: npm test
        working-directory: crates/wasm
      - run: npx tsc --noEmit --strict --target ES2022 --module ESNext --moduleResolution bundler tests/types.ts
        working-directory: crates/wasm

  wheels:
    name: Wheel (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          rust-toolchain: '1.88.0'
          maturin-version: '1.13.3'
          manylinux: '2_28'
          args: --release --locked --manifest-path crates/python/Cargo.toml --out dist
      - name: Check and install the wheel
        shell: bash
        run: |
          python -m pip install twine
          python -m twine check --strict dist/*
          python -m pip install --no-deps --force-reinstall dist/*.whl
      - name: Test the installed wheel
        run: python -m unittest discover -s crates/python/tests -v
      - name: Execute the GeoParquet notebook against local fixtures
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          python -m pip install pyarrow nbformat nbclient ipykernel
          python scripts/test-geoparquet-notebook.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88.0'
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          maturin-version: '1.13.3'
          args: --manifest-path crates/python/Cargo.toml --out dist
      - name: Build and test from the source archive on Python 3.9
        run: |
          python -m pip install twine
          python -m twine check --strict dist/*
          python -m pip wheel --no-deps --wheel-dir rebuilt dist/*.tar.gz
          python -m pip install --no-deps rebuilt/*.whl
          python -m unittest discover -s crates/python/tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
